name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check tag version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/GachaCalendar.App/GachaCalendar.App.csproj
          $version = [string]($project.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version
          if ('${{ github.ref_type }}' -ne 'tag' -or '${{ github.ref_name }}' -ne "v$version") { throw 'Run this workflow on the matching version tag' }
      - name: Build packages
        shell: pwsh
        run: ./script/package_windows.ps1 -IsccPath 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          gh release create '${{ github.ref_name }}' ".release/$version/*Setup.exe" ".release/$version/*portable.zip" ".release/$version/SHA256SUMS.txt" --verify-tag --title "Gacha Calendar $version" --notes-file "docs/releases/v$version.md"
